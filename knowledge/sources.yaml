  - id: pmc-cystatin-creatinine-muscle
    cluster: kidney
    title: Creatinine and cystatin C in testosterone-induced muscle hypertrophy
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11483778/
    topics: [cystatin-c, creatinine, egfr]
    teaches: Why creatinine and cystatin C can disagree when muscle mass changes; dual measurement.

  - id: medlineplus-egfr
    cluster: kidney
    title: MedlinePlus eGFR
    url: https://medlineplus.gov/lab-tests/glomerular-filtration-rate-gfr-test/
