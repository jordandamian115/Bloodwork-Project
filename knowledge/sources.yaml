# Curated public sources. teaching field = what the RAG should learn from each page.
# Run: python -m knowledge.ingest

sources:
  - id: nhlbi-blood-tests
    cluster: core-panels
    title: NHLBI Blood Tests overview
    url: https://www.nhlbi.nih.gov/health/blood-tests
    topics: [cbc, bmp, lipids, enzymes, reference-ranges]
    teaches: Overview of CBC, chemistry/BMP, lipids, enzymes; adult CBC ranges; what high/low RBC, WBC, platelets, hemoglobin, hematocrit, MCV indicate.

  - id: nhlbi-types
    cluster: core-panels
    title: NHLBI Types of Blood Tests
    url: https://www.nhlbi.nih.gov/node/3551
    topics: [cbc, chemistry, heart-risk]
    teaches: Types of tests (CBC, chemistry, enzyme, heart-risk panels); glucose, calcium, electrolytes, BUN/creatinine, troponin/CK-MB, lipoprotein panel and fasting.

  - id: medlineplus-cmp
    cluster: core-panels
    title: MedlinePlus Comprehensive Metabolic Panel
    url: https://medlineplus.gov/ency/article/003468.htm
    topics: [cmp, kidney, liver, glucose, electrolytes]
    teaches: CMP components, typical adult ranges, why ordered for kidney/liver/glucose/electrolytes; lab-to-lab range variation.

  - id: ncbi-normal-ranges
    cluster: core-panels
    title: NCBI Bookshelf Normal Reference Ranges
    url: https://www.ncbi.nlm.nih.gov/books/NBK615342/
    topics: [reference-ranges, thyroid, ua, fsh, lh]
    teaches: Appendix ranges for metabolic, liver, thyroid, urinalysis, iron/ferritin, lipids, FSH/LH (sex- and cycle-stratified).

  - id: academic-pathology-labs
    cluster: core-panels
    title: Essential Laboratory Tests for Medical Education
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9483580/
    topics: [cbc, hormones, renal, hepatic]
    teaches: Detailed descriptions and ranges for CBC components, testosterone, estradiol, cortisol, renal/hepatic markers.

  - id: cdc-nhanes-tst
    cluster: hormones
    title: CDC NHANES Sex Steroid Hormone Panel (TST)
    url: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/TST_L.htm
    topics: [testosterone, shbg, estradiol, fsh, lh, dheas, progesterone]
    teaches: Physiology and measurement of SHBG, total testosterone, estradiol, FSH, LH, progesterone, DHEAS.

  - id: endotext-testicular
    cluster: hormones
    title: Endotext Laboratory Assessment of Testicular Function
    url: https://www.endotext.org/wp-content/uploads/pdfs/laboratory-assessment-of-testicular-function-2.pdf
    topics: [testosterone, shbg, assays]
    teaches: Total/free/bioavailable testosterone, SHBG role, assay issues, clinical interpretation in men.

  - id: pmc-endocrine-pitfalls
    cluster: hormones
    title: Common Pitfalls in the Interpretation of Endocrine Tests
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8453144/
    topics: [testosterone, shbg, lh, fsh]
    teaches: Testosterone sampling timing, SHBG modifiers, free T calculation, LH/FSH use.

  - id: pmc-steroid-diagnostics
    cluster: hormones
    title: Steroid Diagnostics Reference Ranges
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8603733/
    topics: [lc-ms, cortisol, estradiol, testosterone]
    teaches: LC-MS/MS ranges and roles for testosterone, free T, estradiol, pregnenolone, cortisol.

  - id: accessmedicine-lab-values
    cluster: hormones
    title: Laposata Clinical Laboratory Reference Values (AccessMedicine)
    url: https://accessmedicine.mhmedical.com/content.aspx?bookid=2503&sectionid=201361245
    topics: [cortisol, estradiol, testosterone, homocysteine, magnesium]
    teaches: Tabulated ranges for cortisol by time of day, estradiol by sex/status, testosterone, SHBG-related, homocysteine, magnesium. Paywalled — ingest may skip; use MedlinePlus/NCBI tables as public stand-ins.
    skip_fetch: false

  - id: pmc-magnesium-status
    cluster: micronutrients
    title: Interpreting magnesium status (PMID 28806179)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5812344/
    topics: [magnesium, rbc-mg, serum-mg]
    teaches: Serum/plasma vs urinary/dietary magnesium, limitations of a single serum value, ~0.75–0.85 mmol/L grey zone, combined assessment.

  - id: pmc-magnesium-ri-standard
    cluster: micronutrients
    title: Standardization of serum magnesium reference ranges
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9186275/
    topics: [magnesium, reference-intervals]
    teaches: Proposed hypomagnesemia cutoff near 0.85 mmol/L (2.07 mg/dL); lab range variability.

  - id: pmc-micronutrients
    cluster: micronutrients
    title: Micronutrient status cutoffs
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10918648/
    topics: [ferritin, iron, zinc]
    teaches: Iron/zinc and related biomarker cutoffs relevant to ferritin/iron studies.

  - id: medlineplus-magnesium
    cluster: micronutrients
    title: MedlinePlus Magnesium Blood Test
    url: https://medlineplus.gov/lab-tests/magnesium-blood-test/
    topics: [magnesium]
    teaches: Why magnesium is ordered, low/high meaning, typical preparation.

  - id: medlineplus-homocysteine
    cluster: micronutrients
    title: MedlinePlus Homocysteine Test
    url: https://medlineplus.gov/lab-tests/homocysteine-test/
    topics: [homocysteine]
    teaches: Homocysteine as a CVD/B-vitamin related marker; typical reasons for testing. Cross-check AccessMedicine 4–12 µmol/L typical band when that table is unavailable.

  - id: pmc-cv-biomarkers-ht
    cluster: lipids
    title: Cardiovascular biomarkers after hormone therapy
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11972549/
    topics: [ldl, hdl, lpa, insulin]
    teaches: Long-term changes in LDL-C, HDL-C, triglycerides, Lp(a), insulin/HOMA-IR after hormone therapy.

  - id: medlineplus-cholesterol
    cluster: lipids
    title: MedlinePlus Cholesterol Levels
    url: https://medlineplus.gov/lab-tests/cholesterol-levels/
    topics: [lipids, ldl, hdl, triglycerides]
    teaches: Lipid panel interpretation aligned with NIH-style desirable levels (total/LDL/HDL/TG).

  - id: testing-apob
    cluster: lipids
    title: Testing.com Apolipoprotein B
    url: https://www.nhlbi.nih.gov/health/blood-tests
    topics: [apob]
    teaches: ApoB as particle-number marker; desirable levels used in clinical summaries.

  - id: testing-lpa
    cluster: lipids
    title: Testing.com Lipoprotein (a)
    url: https://www.testing.com/tests/lipoprotein-a/
    topics: [lpa]
    teaches: Lp(a) as genetically influenced residual CVD risk marker.

  - id: medlineplus-crp
    cluster: lipids
    title: MedlinePlus C-reactive protein (CRP) test
    url: https://medlineplus.gov/lab-tests/c-reactive-protein-crp-test/
    topics: [hs-crp, inflammation]
    teaches: CRP/hs-CRP for inflammation and heart-risk context.

  - id: aarp-routine-labs
