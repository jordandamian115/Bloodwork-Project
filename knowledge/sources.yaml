    teaches: eGFR reporting, kidney staging language, limits of a single creatinine-based estimate.

  - id: medlineplus-creatinine
    cluster: kidney
    title: MedlinePlus Creatinine Test
    url: https://medlineplus.gov/lab-tests/creatinine-test/
    topics: [creatinine, kidney]
    teaches: Serum creatinine, muscle-mass effects, pairing with eGFR.

  - id: medlineplus-cystatin-c
    cluster: kidney
    title: MedlinePlus Cystatin C Test
    url: https://medlineplus.gov/lab-tests/glomerular-filtration-rate-gfr-test/
    topics: [cystatin-c, egfr]
    teaches: When cystatin C is added and how it differs from creatinine.

  - id: pmc-ri-28-analytes
