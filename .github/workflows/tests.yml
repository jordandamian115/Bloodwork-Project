name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unit-test deps
        run: python -m pip install --upgrade pip && python -m pip install pytest pyyaml
      - name: Run pytest
        run: python -m pytest
